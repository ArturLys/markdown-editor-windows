<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #1e1e2e;
      --surface:     #24273a;
      --border:      #363a4f;
      --text:        #cad3f5;
      --text-muted:  #6e738d;
      --accent:      #8aadf4;
      --green:       #a6da95;
      --red:         #ed8796;
      --yellow:      #eed49f;
      --code-bg:     #181926;
      --scrollbar:   #363a4f;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      padding: 48px 0 96px;
      min-height: 100vh;
    }

    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 32px;
      outline: none;
      caret-color: var(--accent);
      min-height: 60vh;
    }

    /* Headings */
    h1, h2, h3, h4, h5, h6 {
      color: var(--accent);
      font-weight: 600;
      line-height: 1.3;
      margin: 2em 0 0.5em;
    }
    h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4em; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    h3 { font-size: 1.25rem; color: var(--green); }
    h4, h5, h6 { font-size: 1rem; color: var(--yellow); }

    /* Paragraphs & inline */
    p { margin: 1em 0; }
    strong { color: #fff; font-weight: 600; }
    em { color: var(--yellow); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Code */
    code {
      background: var(--code-bg);
      color: var(--green);
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 0.875em;
      padding: 0.15em 0.45em;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      overflow-x: auto;
      margin: 1.5em 0;
    }
    pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 0.9em;
      line-height: 1.6;
    }

    /* Blockquote */
    blockquote {
      border-left: 3px solid var(--accent);
      background: var(--surface);
      margin: 1.5em 0;
      padding: 12px 20px;
      border-radius: 0 6px 6px 0;
      color: var(--text-muted);
    }
    blockquote p { margin: 0; }

    /* Lists */
    ul, ol { padding-left: 1.75em; margin: 1em 0; }
    li { margin: 0.3em 0; }
    li > ul, li > ol { margin: 0.2em 0; }
    li p { margin: 0; }

    /* Bullets are drawn by hand so that task checkboxes can sit on exactly
       the same axis as the dots; native ::marker geometry is not addressable. */
    ul:not([data-type="taskList"]) > li { list-style: none; position: relative; }
    ul:not([data-type="taskList"]) > li::before {
      content: '\2022';
      position: absolute;
      left: -1em;
      color: inherit;
    }

    ul[data-type="taskList"] { list-style: none; }
    ul[data-type="taskList"] > li { position: relative; list-style: none; }
    ul[data-type="taskList"] > li > label { position: absolute; left: -1.27em; top: 0.41em; line-height: 1; }
    ul[data-type="taskList"] > li > div { min-width: 0; }
    ul[data-type="taskList"] input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px; height: 15px; margin: 0; cursor: pointer; vertical-align: top;
    }
    ul[data-type="taskList"] > li[data-checked="true"] > div { color: var(--text-muted); text-decoration: line-through; }

    /* Tables */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5em 0;
      font-size: 0.95em;
    }
    th {
      background: var(--surface);
      color: var(--accent);
      font-weight: 600;
      text-align: left;
      padding: 10px 16px;
      border: 1px solid var(--border);
    }
    td {
      padding: 8px 16px;
      border: 1px solid var(--border);
    }
    tr:nth-child(even) td { background: var(--surface); }
    th p, td p { margin: 0; }

    /* HR */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2em 0;
    }

    /* Images */
    img { max-width: 100%; border-radius: 6px; }

    ::selection { background: rgba(138, 173, 244, 0.35); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="editor.js"></script>
</body>
</html>
